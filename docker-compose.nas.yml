# ZIMaker on a NAS or server (UGREEN, Synology, QNAP, Unraid, Portainer...). This one file is all you need: it
# downloads the ready-made image (rebuilt on GitHub whenever ZIMaker changes).
#
#   1. Create the two folders below (data and zims) in your NAS's file manager, or change them to your own.
#   2. Paste this file into a new Project / Stack in your NAS's Docker app and start it.
#   3. Open http://<your NAS's address>:8765 in a browser, e.g. http://192.168.1.20:8765
#
# To update ZIMaker later: pull the image again in your Docker app (or: docker compose pull && docker compose up -d).
# Settings, jobs and ZIM files are kept.
#
# ZIMaker has no password: anyone on your network who can open that address can use it, and can read the
# folders listed under "volumes". Don't forward its port to the internet.
services:
  zimaker:
    image: ghcr.io/godlymorbid/zimaker:latest
    container_name: zimaker
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - /volume1/docker/ZIMaker/data:/data      # settings, the Jobs list, uploaded files
      - /volume1/docker/ZIMaker/zims:/output    # where ZIM files are saved
      # - /volume1/downloads:/watch             # a watched folder (Settings -> Watched folder: /watch)
      # - /volume1/books:/input:ro              # big files to convert by path (/input/book.pdf) instead of uploading
