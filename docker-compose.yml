# ZIMaker in Docker, on your own computer. In this folder:
#
#   docker compose up -d --build      start it (the first build downloads about 1 GB and takes a few minutes)
#   open http://localhost:8765        ZIMaker's window, in any browser
#   docker compose stop               stop it
#
# For a NAS or a server, use docker-compose.nas.yml instead: it needs no other file.
services:
  zimaker:
    build: .
    pull_policy: build
    image: zimaker
    container_name: zimaker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"       # this computer only (ZIMaker has no password)
    volumes:
      - zimaker-data:/data          # settings, the Jobs list, uploaded files
      - ./zims:/output              # where ZIM files are saved: the "zims" folder next to this file
      # - ./watch:/watch            # a watched folder (Settings -> Watched folder: /watch)
      # - /path/to/your/books:/input:ro   # big files to convert by path (/input/book.pdf) instead of uploading
    extra_hosts:
      - "host.docker.internal:host-gateway"   # a proxy on this computer is reached as host.docker.internal

volumes:
  zimaker-data:
